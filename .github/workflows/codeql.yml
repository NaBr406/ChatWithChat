name: "CodeQL Advanced"

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - "LICENSE"
      - ".idea/**"
      - ".editorconfig"
      - "images/**"
      - "metadata/**"
  schedule:
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze (kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Autobuild runs assemble, which also builds Release and requires untracked
      # production model assets. Debug compiles the app sources needed for scanning.
      # Disable caches so CodeQL observes compilation even on repeated runs.
      - name: Build debug sources for CodeQL
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache :app:assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:kotlin"
